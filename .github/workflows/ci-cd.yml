# ShopPro Frontend — CI/CD Pipeline
# CI: har push aur pull request par lint + tests + build
# CD: tests pass hon, main branch ho, aur DEPLOY_ENABLED = true ho → Vercel deploy

name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies install
        run: npm ci

      - name: Lint (code mein galtiyan)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8000/api' }}
          VITE_STORAGE_URL: ${{ vars.VITE_STORAGE_URL || 'http://localhost:8000/storage' }}

  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vercel CLI install
        run: npm install --global vercel@latest

      - name: Vercel project settings aur environment variables lao
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Production build (Vercel ke andaz mein)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Live par deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Website live: $URL"
          echo "### 🚀 Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
